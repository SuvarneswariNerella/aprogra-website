version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: strapi
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi_secure_password_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strapi -d strapi"]
      interval: 5s
      timeout: 5s
      retries: 10

  cms:
    build:
      context: ./backend/aprogra-cms
      dockerfile: Dockerfile
    restart: always
    environment:
      - HOST=0.0.0.0
      - PORT=1337
      - APP_KEYS=Tob81V/zMh2fWjD99VlBsg==,HlE+l6jF1Jz1+9xK23L0Lg==,eZ00q33uYjD+n3n344LL1g==,44Kk22lLmMnN00pPqQrRsS==
      - API_TOKEN_SALT=salt1234567890abcdef123456
      - ADMIN_JWT_SECRET=adminsecret1234567890abcdef1234
      - TRANSFER_TOKEN_SALT=transfersalt1234567890abcdef12
      - JWT_SECRET=jwtsecret1234567890abcdef123456
      - DATABASE_CLIENT=postgres
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=strapi
      - DATABASE_USERNAME=strapi
      - DATABASE_PASSWORD=strapi_secure_password_2026
      - DATABASE_SSL=false
      - PUBLIC_URL=https://aprogra-cms-7b98bb-31-97-102-80.sslip.io
    volumes:
      - cms_uploads:/opt/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - cms

volumes:
  postgres_data:
  cms_uploads:
