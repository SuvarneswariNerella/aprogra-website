server {
    listen 80;
    server_name localhost;

    # Docker internal DNS resolver to dynamically re-resolve container IPs on redeployment
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $cms_upstream http://cms:1337;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to Strapi CMS container
    location /api/ {
        proxy_pass $cms_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Serve uploaded media from Strapi
    location /uploads/ {
        proxy_pass $cms_upstream;
        proxy_set_header Host $host;
    }
}
